name: Keepalive

on:
  schedule:
    # Runs every Sunday at 12:00 UTC — well within the 60-day window
    - cron: '0 12 * * 0'
  workflow_dispatch:  # so you can also trigger it manually

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Touch keepalive file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --quiet --cached || git commit -m "chore: keepalive ping"
          git push
